<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Piano Repertoire Keeper</title>
<style>
  :root {
    --bg: #000000; --card: #0a0a0a; --text: #f5f5f5; --muted: #a3a3a3;
    --accent: #f59e0b; --accent-soft: #26200d; --border: #262626;
    --danger: #ef4444; --radius: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
  }
  ::-webkit-scrollbar { background: #000; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding-bottom: 72px; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .3px; }
  header .sub { font-size: .75rem; color: var(--muted); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  h3 { font-size: .9rem; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .8rem; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--card); color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  textarea { resize: vertical; min-height: 56px; }
  label { font-size: .78rem; color: var(--muted); display: block; margin: 10px 0 4px; }
  button { font: inherit; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    background: var(--accent); color: #000; font-weight: 600; }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.danger-text { background: none; color: var(--danger); padding: 4px 8px; font-weight: 400; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .piece { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border); }
  .piece:last-child { border-bottom: none; }
  .piece .title { font-weight: 600; }
  .piece .meta { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .stars { color: var(--accent); letter-spacing: 2px; font-size: .85rem; }
  .suggest-box { text-align: center; padding: 28px 16px; }
  .suggest-box .big { font-size: 1.5rem; font-weight: 700; margin: 6px 0 2px; }
  .rating-row { display: flex; justify-content: center; gap: 10px; margin: 18px 0; }
  .rating-row button { font-size: 1.3rem; background: none; border: 1px solid var(--border);
    border-radius: 10px; width: 48px; height: 48px; color: var(--text); }
  .rating-row button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: #262626; color: #ffffff; padding: 10px 18px; border-radius: 999px;
    border: 1px solid #404040; font-size: .82rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 90; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--border); display: flex; z-index: 20; }
  nav button { flex: 1; background: none; color: var(--muted); padding: 12px 4px;
    font-size: .68rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button .ico { font-size: 1.25rem; }
  nav button.active { color: var(--accent); }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: .9rem; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: .68rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  .settings-block { margin-bottom: 20px; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .8em; }
  .sync-state { font-size: .8rem; color: var(--muted); margin-top: 6px; }

  /* WIP section */
  .wip-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .wip-item:last-child { border-bottom: none; }
  .wip-stars { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .wip-stars button.star-btn { font-size: 1.35rem; background: none; color: var(--muted);
    padding: 0 2px; border: none; line-height: 1; }
  .wip-stars button.star-btn.on { color: var(--accent); }
  .wip-stars .mini-btn { padding: 5px 12px; font-size: .75rem; border-radius: 999px; }
  .session-banner { display: flex; justify-content: space-between; align-items: center;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; font-size: .8rem; color: var(--accent); }
  .session-banner button { padding: 7px 14px; font-size: .8rem; }
  .wip-controls { display: flex; gap: 6px; }
  .wip-controls button { padding: 4px 8px; font-size: .75rem; font-weight: 500;
    background: var(--accent-soft); color: var(--accent); }
  .mini-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .mini-btn { padding: 5px 10px; font-size: .78rem; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  /* Sheet viewer overlay */
  #sheetOverlay { position: fixed; inset: 0; background: #000; z-index: 60;
    display: flex; flex-direction: column; }
  #sheetBar { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: rgba(0,0,0,.85); border-bottom: 1px solid var(--border); z-index: 62; }
  #sheetBar .title { flex: 1; font-size: .85rem; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #sheetBar button { padding: 8px 12px; font-size: .8rem; }
  #sheetStage { flex: 1; position: relative; overflow: hidden; touch-action: none; }
  #sheetCanvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  #sheetTapPrev, #sheetTapNext { position: absolute; top: 0; bottom: 0; width: 30%;
    z-index: 61; }
  #sheetTapPrev { left: 0; }
  #sheetTapNext { right: 0; }
  #sheetPageHint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(38,38,38,.9); border: 1px solid #404040; color: #fff;
    font-size: .78rem; padding: 6px 14px; border-radius: 999px; pointer-events: none; z-index: 61; }
  #sheetLoading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: var(--muted); font-size: .9rem; z-index: 61; }

  /* In-sheet rating prompt */
  #sheetRating { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 70;
    display: flex; align-items: center; justify-content: center; }
  #sheetRating .box { background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; text-align: center; max-width: 340px; width: 90%; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Piano Repertoire Keeper</h1>
    <div class="sub" id="hdrSub"></div>
  </div>
  <div id="hdrSync"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>

<script>
"use strict";
/* ============================================================
   Piano Repertoire Keeper
   - Local-first; Google Drive sync (hidden appDataFolder) for
     the repertoire JSON and attached sheet PDFs
   - Perfected list: weighted randomizer
   - WIP list: decay-mass priority + batch session logging
   - Sheet reader: PDF.js viewer with tap zones, swipe and
     AirTurn (Bluetooth page-turn) keyboard input; rating
     prompt after the last page
   ============================================================ */

const STORE_KEY = "prk-data-v1";
const SETTINGS_KEY = "prk-settings-v1";
const SESSION_KEY = "prk-session-v1";
const DRIVE_FILE = "piano-repertoire.json";
const GIS_SRC = "https://accounts.google.com/gsi/client";
const DRIVE_SCOPES = "https://www.googleapis.com/auth/drive.appdata";
const PDFJS_VER = "3.11.174";
const PDFJS_SRC = "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VER + "/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VER + "/build/pdf.worker.min.js";

/* ---------- state ---------- */
let data = { pieces: [] };   // piece: {id,title,composer,notes,status,wipSince,perfectedSince,
                             //        sheet:{driveId,name}|null, history:[...]}
let settings = {
  clientId: "",
  halfLifeDays: 21,
  scorePower: 1.6,
  tauDays: 14,
  autoPush: true
};
let view = "play";
let currentPick = null;
let currentRating = 0;
let ratingOrigin = "play";
let editingId = null;
let wipRatings = {};
let wipOrderFrozen = null;
let uploadBusy = false;

/* sheet viewer state */
let sheet = null;   // { pieceId, pdf, page, numPages, zoom, rendering }
let sheetRatingValue = 0;

/* ---------- persistence ---------- */
let storageWarned = false;
function save() {
  data.updatedAt = Date.now();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      toast("⚠ Browser storage unavailable — data won't persist here.");
    }
  }
  if (settings.autoPush && signedIn()) schedulePush();
}
function load() {
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || { pieces: [] }; } catch { data = { pieces: [] }; }
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch {}
  data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
  try {
    const pend = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (pend?.ratings) {
      wipRatings = pend.ratings;
      wipOrderFrozen = (pend.orderIds || [])
        .map(id => data.pieces.find(p => p.id === id))
        .filter(Boolean);
      if (pend.diceId) currentPick = data.pieces.find(p => p.id === pend.diceId) || null;
      currentRating = pend.diceRating || 0;
    }
  } catch {}
}
function savePendingSession() {
  try {
    if (!Object.keys(wipRatings).length && !currentPick) { localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      ratings: wipRatings,
      orderIds: (wipOrderFrozen || []).map(p => p.id),
      diceId: currentPick?.id || null,
      diceRating: currentRating
    }));
  } catch {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- helpers ---------- */
function sessionTs(s) { return s.ts ? +new Date(s.ts) : +new Date((s.date || "1970-01-01") + "T00:00:00"); }
function lastSession(p) {
  if (!p.history || !p.history.length) return null;
  return p.history.reduce((a, b) => sessionTs(a) >= sessionTs(b) ? a : b);
}
function hasSessions(p) { return p.history && p.history.length > 0; }
function wipPieces() { return data.pieces.filter(p => p.status === "wip"); }
function perfectedPieces() { return data.pieces.filter(p => p.status !== "wip"); }
function daysSinceMs(ms) { return Math.max(0, Math.floor((Date.now() - ms) / 86400000)); }
function fmtDays(d) {
  if (d === null) return "never played";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  return d + " days ago";
}
function fmtSessionDays(s) { return s?.ts ? fmtDays(daysSinceMs(sessionTs(s))) : fmtDays(daysSince(s?.date)); }
function fmtDateTime(s) {
  const d = new Date(sessionTs(s));
  const sameDay = new Date().toDateString() === d.toDateString();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return sameDay ? "today " + time : d.toLocaleDateString() + " " + time;
}
function stars(n) { return n ? "★".repeat(n) + "☆".repeat(5 - n) : "—"; }

/* ---------- perfected randomizer ---------- */
function weightOf(p) {
  const last = lastSession(p);
  const scoreW = last ? Math.pow(6 - last.rating, settings.scorePower) : 6;
  const d = last ? daysSinceMs(sessionTs(last)) : null;
  const timeW = d === null ? 2.5 : 1 + d / settings.halfLifeDays;
  return scoreW * timeW;
}
function pickPiece() {
  const pool = perfectedPieces();
  if (!pool.length) return null;
  const ws = pool.map(p => ({ p, w: weightOf(p) }));
  const total = ws.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const x of ws) { r -= x.w; if (r <= 0) return x.p; }
  return ws[ws.length - 1].p;
}

/* ---------- WIP urgency ---------- */
function wipStats(p) {
  const tau = settings.tauDays * 86400000;
  const hist = p.history || [];
  let M = 0, wsum = 0;
  for (const s of hist) {
    const age = Math.max(0, Date.now() - sessionTs(s));
    const w = Math.exp(-age / tau);
    M += w; wsum += w * s.rating;
  }
  const basis = M > 0 ? wsum / M : 1;
  const neglect = 1 + 3 / (M + 1);
  return { M, basis, neglect };
}
function wipUrgency(p) {
  const { neglect, basis } = wipStats(p);
  const tenureDays = p.wipSince ? daysSinceMs(+new Date(p.wipSince)) : 0;
  return neglect * Math.pow(6 - basis, 1.6) * (1 + tenureDays / 28);
}
function sortedWip() {
  if (wipOrderFrozen && Object.keys(wipRatings).length) return wipOrderFrozen;
  const s = [...wipPieces()].sort((a, b) => wipUrgency(b) - wipUrgency(a));
  wipOrderFrozen = Object.keys(wipRatings).length ? s : null;
  return s;
}
function endSessionMode() { wipRatings = {}; wipOrderFrozen = null; savePendingSession(); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, longMs) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), longMs || 2600);
}

/* ============================================================
   Google Drive sync
   ============================================================ */
let tokenClient = null;
let accessToken = null;
let pushTimer = null;

function signedIn() { return !!accessToken; }

function loadGis() {
  return new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const s = document.createElement("script");
    s.src = GIS_SRC; s.async = true; s.onload = res;
    s.onerror = () => rej(new Error("Could not load Google Identity Services (needs internet)."));
    document.head.appendChild(s);
  });
}

async function ensureTokenClient() {
  await loadGis();
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: settings.clientId,
      scope: DRIVE_SCOPES,
      callback: (resp) => {
        if (resp.access_token) { accessToken = resp.access_token; render(); pushToDrive(); }
      }
    });
  }
}

async function signIn() {
  if (!settings.clientId) { toast("Add your OAuth Client ID in Settings first."); switchView("settings"); return; }
  try {
    await ensureTokenClient();
    tokenClient.requestAccessToken({ prompt: "" });
  } catch (e) { toast(e.message); }
}

async function trySignInSilently() {
  if (!settings.clientId || accessToken) return;
  try {
    await ensureTokenClient();
    tokenClient.requestAccessToken({ prompt: "" });
  } catch {}
}

function signOut() {
  if (accessToken && window.google?.accounts?.oauth2) {
    try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch {}
  }
  accessToken = null; render();
}

async function driveCall(path, opts = {}) {
  const r = await fetch("https://www.googleapis.com/" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + accessToken, ...(opts.headers || {}) }
  });
  if (r.status === 401) { accessToken = null; throw new Error("Session expired — sign in again."); }
  if (!r.ok) throw new Error("Drive error " + r.status);
  return r;
}

async function findDriveFile() {
  const r = await driveCall("drive/v3/files?q=" + encodeURIComponent("name='" + DRIVE_FILE + "'") + "&spaces=appDataFolder&fields=files(id,name,modifiedTime)");
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0] : null;
}

async function pushToDrive(silent) {
  if (!signedIn()) return;
  try {
    const existing = await findDriveFile();
    const boundary = "prk" + Date.now();
    const body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(existing ? { name: DRIVE_FILE } : { name: DRIVE_FILE, mimeType: "application/json", parents: ["appDataFolder"] }) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify(data) + "\r\n" +
      "--" + boundary + "--";
    const url = existing
      ? "https://www.googleapis.com/upload/drive/v3/files/" + existing.id + "?uploadType=multipart"
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    const r = await fetch(url, {
      method: existing ? "PATCH" : "POST",
      headers: { Authorization: "Bearer " + accessToken, "Content-Type": "multipart/related; boundary=" + boundary },
      body
    });
    if (r.status === 401) { accessToken = null; throw new Error("Session expired — sign in again."); }
    if (!r.ok) {
      let detail = r.status;
      try { const e = await r.json(); detail += " " + (e.error?.message || ""); } catch {}
      throw new Error("Upload failed (" + detail + ")");
    }
    if (!silent) toast("Synced to Google Drive ✓");
  } catch (e) { toast("Sync failed: " + e.message); }
}

async function pullFromDrive() {
  if (!signedIn()) { toast("Sign in first."); return; }
  try {
    const f = await findDriveFile();
    if (!f) { toast("No data in Drive yet — will push this device's data."); await pushToDrive(true); return; }
    const r = await driveCall("drive/v3/files/" + f.id + "?alt=media");
    const remote = await r.json();
    if (!remote.pieces) throw new Error("Unexpected file content");
    const remoteNewer =
      (remote.updatedAt || 0) > (data.updatedAt || 0) ||
      (remote.pieces.length > data.pieces.length && !data.pieces.some(hasSessions)) ||
      (data.pieces.length === 0 && remote.pieces.length > 0);
    if (remoteNewer) {
      data = remote;
      data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
      save(); render(); toast("Loaded data from Drive ✓");
    } else { await pushToDrive(true); toast("Local data was newer — pushed to Drive ✓"); render(); }
  } catch (e) { toast("Sync failed: " + e.message); }
}

function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushToDrive(true), 3000);
}

/* ============================================================
   Sheet storage (Drive appDataFolder, one PDF per piece)
   ============================================================ */
async function uploadSheet(pieceId, file) {
  if (!signedIn()) { toast("Sign in with Google first — sheets live in your Drive."); return; }
  if (uploadBusy) { toast("An upload is already running."); return; }
  uploadBusy = true;
  const p = data.pieces.find(x => x.id === pieceId);
  if (!p) { uploadBusy = false; return; }
  toast("Uploading sheet…", 30000);
  try {
    const oldSheet = p.sheet || null;
    // resumable upload (handles big PDFs)
    const meta = { name: "sheet-" + pieceId + ".pdf", mimeType: "application/pdf", parents: ["appDataFolder"] };
    const init = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + accessToken,
        "Content-Type": "application/json; charset=UTF-8",
        "X-Upload-Content-Type": "application/pdf",
        "X-Upload-Content-Length": String(file.size)
      },
      body: JSON.stringify(meta)
    });
    if (init.status === 401) { accessToken = null; throw new Error("Session expired — sign in again."); }
    if (!init.ok) throw new Error("Upload init failed (" + init.status + ")");
    const loc = init.headers.get("Location");
    if (!loc) throw new Error("No upload session URL returned");
    const up = await fetch(loc, {
      method: "PUT",
      headers: { "Content-Type": "application/pdf", "Content-Length": String(file.size) },
      body: file
    });
    if (!up.ok) throw new Error("Upload failed (" + up.status + ")");
    const fin = await up.json();
    p.sheet = { driveId: fin.id, name: file.name };
    if (oldSheet?.driveId && oldSheet.driveId !== fin.id) {
      try { await driveCall("drive/v3/files/" + oldSheet.driveId, { method: "DELETE" }); } catch {}
    }
    save(); render();
    toast("Sheet attached to \"" + p.title + "\" ✓");
  } catch (e) {
    toast("Sheet upload failed: " + e.message);
  } finally { uploadBusy = false; }
}

async function removeSheet(pieceId) {
  const p = data.pieces.find(x => x.id === pieceId);
  if (!p?.sheet) return;
  const driveId = p.sheet.driveId;
  const name = p.title;
  if (!confirm(`Remove the attached sheet from "${name}"? (Play history is kept.)`)) return;
  p.sheet = null;
  save(); render();
  toast("Sheet removed from \"" + name + "\"");
  dropSheetFromCache(driveId);
  if (signedIn() && driveId) {
    try { await driveCall("drive/v3/files/" + driveId, { method: "DELETE" }); } catch {}
  }
}

function triggerAttach(pieceId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/pdf";
  inp.onchange = () => { if (inp.files?.[0]) uploadSheet(pieceId, inp.files[0]); };
  inp.click();
}

/* ---------- PDF.js viewer ---------- */
const SHEET_CACHE = "prk-sheets-v1";
async function sheetFromCache(driveId) {
  try {
    const cache = await caches.open(SHEET_CACHE);
    const hit = await cache.match(driveId);
    if (hit) return await hit.arrayBuffer();
  } catch {}
  return null;
}
async function cacheSheet(driveId, buf) {
  try {
    const cache = await caches.open(SHEET_CACHE);
    await cache.put(driveId, new Response(buf, { headers: { "Content-Type": "application/pdf" } }));
  } catch {}
}
async function dropSheetFromCache(driveId) {
  try { (await caches.open(SHEET_CACHE)).delete(driveId); } catch {}
}

function loadPdfJs() {
  return new Promise((res, rej) => {
    if (window.pdfjsLib) return res();
    const s = document.createElement("script");
    s.src = PDFJS_SRC; s.async = true;
    s.onload = () => {
      try { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; res(); }
      catch (e) { rej(e); }
    };
    s.onerror = () => rej(new Error("Could not load the PDF library (needs internet)."));
    document.head.appendChild(s);
  });
}

async function openSheet(pieceId) {
  const p = data.pieces.find(x => x.id === pieceId);
  if (!p?.sheet) { triggerAttach(pieceId); return; }
  if (!signedIn()) { toast("Sign in with Google first — sheets live in your Drive."); return; }
  toast("Opening sheet…", 8000);
  try {
    await loadPdfJs();
    let buf = await sheetFromCache(p.sheet.driveId);
    if (!buf) {
      const r = await driveCall("drive/v3/files/" + p.sheet.driveId + "?alt=media");
      buf = await r.arrayBuffer();
      cacheSheet(p.sheet.driveId, buf);   // offline from now on
    }
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    sheet = { pieceId, pdf, page: 1, numPages: pdf.numPages, zoom: 1 };
    sheetRatingValue = 0;
    renderSheetOverlay();
  } catch (e) {
    toast("Could not open sheet: " + e.message);
  }
}

function renderSheetOverlay() {
  let ov = document.getElementById("sheetOverlay");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "sheetOverlay";
    ov.innerHTML = `
      <div id="sheetBar">
        <button class="ghost" onclick="sheetNav(-99)">‹‹</button>
        <button class="ghost" onclick="zoom(-1)">−</button>
        <div class="title" id="sheetTitle"></div>
        <button class="ghost" onclick="zoom(1)">+</button>
        <button class="ghost" title="Remove sheet" onclick="removeSheet(sheet.pieceId);closeSheet()">🗑</button>
        <button class="ghost" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheetStage">
        <div id="sheetTapPrev" onclick="sheetNav(-1)"></div>
        <div id="sheetTapNext" onclick="sheetNav(1)"></div>
        <canvas id="sheetCanvas"></canvas>
        <div id="sheetPageHint"></div>
        <div id="sheetLoading">Loading…</div>
      </div>`;
    document.body.appendChild(ov);
    // swipe support
    const stage = ov.querySelector("#sheetStage");
    let sx = null, sy = null;
    stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) sheetNav(dx < 0 ? 1 : -1);
      sx = null;
    }, { passive: true });
    // AirTurn Duo & keyboard page turns
    window.addEventListener("keydown", e => {
      if (!sheet) return;
      if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); sheetNav(1); }
      else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); sheetNav(-1); }
    });
  }
  const p = data.pieces.find(x => x.id === sheet.pieceId);
  ov.style.display = "flex";
  document.getElementById("sheetTitle").textContent = p ? p.title : "";
  drawSheetPage();
}

async function drawSheetPage() {
  if (!sheet) return;
  const stage = document.getElementById("sheetStage");
  const canvas = document.getElementById("sheetCanvas");
  const loading = document.getElementById("sheetLoading");
  const hint = document.getElementById("sheetPageHint");
  hint.textContent = sheet.page + " / " + sheet.numPages + (sheet.page === sheet.numPages ? " · tap/rate →" : "");
  loading.style.display = "block";
  try {
    const page = await sheet.pdf.getPage(sheet.page);
    const availW = stage.clientWidth, availH = stage.clientHeight;
    const base = page.getViewport({ scale: 1 });
    const fit = Math.min(availW / base.width, availH / base.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = fit * sheet.zoom;
    const vp = page.getViewport({ scale });
    canvas.width = vp.width * dpr; canvas.height = vp.height * dpr;
    canvas.style.width = vp.width + "px"; canvas.style.height = vp.height + "px";
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp, transform: [dpr, 0, 0, dpr, 0, 0] }).promise;
  } catch (e) {
    toast("Render error: " + e.message);
  }
  loading.style.display = "none";
}

function sheetNav(dir) {
  if (!sheet) return;
  const next = sheet.page + dir;
  if (next < 1) { sheet.page = 1; drawSheetPage(); return; }
  if (next > sheet.numPages) { openSheetRating(); return; }  // forward on last page → rating
  sheet.page = next;
  drawSheetPage();
}

function zoom(dir) {
  if (!sheet) return;
  sheet.zoom = Math.min(3, Math.max(0.6, sheet.zoom + dir * 0.15));
  drawSheetPage();
}

function closeSheet() {
  const ov = document.getElementById("sheetOverlay");
  if (ov) ov.style.display = "none";
  sheet = null;
  const sr = document.getElementById("sheetRating");
  if (sr) sr.remove();
}

/* in-sheet rating prompt (after last page) */
function openSheetRating() {
  if (!sheet) return;
  sheetRatingValue = 0;
  let sr = document.getElementById("sheetRating");
  if (!sr) {
    sr = document.createElement("div");
    sr.id = "sheetRating";
    sr.innerHTML = `<div class="box">
      <h3>How did it go?</h3>
      <div class="rating-row" id="sheetRatingStars"></div>
      <div class="muted" id="sheetRatingLabel" style="margin-bottom:12px">Tap the stars</div>
      <div class="row" style="justify-content:center">
        <button class="secondary" onclick="document.getElementById('sheetRating').remove()">Back to sheet</button>
        <button id="sheetRatingSave" onclick="submitSheetRating()" disabled>Log</button>
      </div>
    </div>`;
    document.body.appendChild(sr);
  }
  sr.style.display = "flex";
  drawSheetStars();
}
function drawSheetStars() {
  const row = document.getElementById("sheetRatingStars");
  if (!row) return;
  row.innerHTML = [1,2,3,4,5].map(n =>
    `<button class="${sheetRatingValue >= n ? "on" : ""}" onclick="setSheetRating(${n})">★</button>`).join("");
  document.getElementById("sheetRatingLabel").textContent =
    sheetRatingValue === 0 ? "Tap the stars" :
    ["","Rough — needs serious work","Shaky, quite rusty","Okay with slips","Solid, minor slips","Near performance level"][sheetRatingValue];
  document.getElementById("sheetRatingSave").disabled = !sheetRatingValue;
}
function setSheetRating(n) { sheetRatingValue = n; drawSheetStars(); }
function submitSheetRating() {
  if (!sheet || !sheetRatingValue) return;
  const p = data.pieces.find(x => x.id === sheet.pieceId);
  if (p) (p.history = p.history || []).push({ ts: new Date().toISOString(), rating: sheetRatingValue });
  delete wipRatings[sheet.pieceId];   // avoids double-logging if it also had pending stars
  if (!Object.keys(wipRatings).length && !currentPick) { wipOrderFrozen = null; }
  savePendingSession();
  closeSheet();
  save(); render();
  toast("Logged — nicely played! 🎹");
}

function setWipRating(id, n) {
  if (n === 0) delete wipRatings[id]; else wipRatings[id] = n;
  if (Object.keys(wipRatings).length && !wipOrderFrozen) wipOrderFrozen = sortedWip();
  savePendingSession(); render();
}
function logOne(id) {
  const r = wipRatings[id];
  if (!r) return;
  const p = data.pieces.find(x => x.id === id);
  if (p) { (p.history = p.history || []).push({ ts: new Date().toISOString(), rating: r }); }
  delete wipRatings[id];
  if (!Object.keys(wipRatings).length) { wipOrderFrozen = null; savePendingSession(); }
  save(); render(); toast("Logged ✓");
}
function logSession() {
  const ids = Object.keys(wipRatings);
  if (!ids.length) return;
  const ts = new Date().toISOString();
  for (const id of ids) {
    const p = data.pieces.find(x => x.id === id);
    if (p) (p.history = p.history || []).push({ ts, rating: wipRatings[id] });
  }
  const n = ids.length;
  wipRatings = {}; wipOrderFrozen = null; savePendingSession();
  save(); render(); toast(`Logged ${n} piece${n > 1 ? "s" : ""} — nice session! 🎹`);
}
function clearSession() { wipRatings = {}; wipOrderFrozen = null; savePendingSession(); render(); }

function suggest() {
  currentPick = pickPiece();

  currentRating = 0;
  ratingOrigin = "play";

function savePiece() {
  const title = document.getElementById("fTitle").value.trim();
  const composer = document.getElementById("fComposer").value.trim();
  const notes = document.getElementById("fNotes").value.trim();
  const status = document.getElementById("fStatus").value;
  if (!title) { toast("A title is required."); return; }
  if (editingId) {
    const p = data.pieces.find(x => x.id === editingId);
    const changed = p.status !== status;
    Object.assign(p, { title, composer, notes, status });
    if (status === "wip" && changed) p.wipSince = new Date().toISOString();
    if (status === "perfected" && changed) p.perfectedSince = new Date().toISOString();
  } else {
    const nowIso = new Date().toISOString();
    data.pieces.push({
      id: uid(), title, composer, notes, status, sheet: null, history: [],
      wipSince: status === "wip" ? nowIso : null,
      perfectedSince: status === "perfected" ? nowIso : null
    });
  }
  editingId = null;
  save(); render(); toast("Saved ✓");
}
function editPiece(id) { editingId = id; render(); }
function cancelEdit() { editingId = null; render(); }
function removePiece(id) {
  const p = data.pieces.find(x => x.id === id);
  if (p && confirm(`Remove "${p.title}" and its play history?`)) {
    data.pieces = data.pieces.filter(x => x.id !== id);
    delete wipRatings[id];
    save(); savePendingSession(); render(); toast("Removed.");
  }
}
function markPerfected(id) {
  const p = data.pieces.find(x => x.id === id);
  if (!p) return;
  const last = lastSession(p);
  p.status = "perfected";
  p.perfectedSince = new Date().toISOString();
  delete wipRatings[id];
  if (!Object.keys(wipRatings).length) wipOrderFrozen = null;
  save(); savePendingSession(); render();
  toast(`🎓 "${p.title}" perfected! ${last ? "Final rating: " + stars(last.rating) : ""}`);
}
function markWip(id) {
  const p = data.pieces.find(x => x.id === id);
  if (!p) return;
  p.status = "wip";
  p.wipSince = new Date().toISOString();
  save(); render(); toast(`"${p.title}" sent back to practice — clock restarted.`);
}

        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJson(event)">
      </div>
      <p class="muted" style="margin-top:8px">Note: the JSON backup contains your list and history, not the sheet PDFs (those live only in Drive).</p>
    </div>`;
}

function saveSettings() {
  const cid = document.getElementById("sClientId");
  if (cid) settings.clientId = cid.value.trim();
  const hl = document.getElementById("sHalfLife");
  if (hl) settings.halfLifeDays = +hl.value;
  const sp = document.getElementById("sScorePower");
  if (sp) settings.scorePower = +sp.value;
  const tau = document.getElementById("sTau");
  if (tau) settings.tauDays = +tau.value;
  tokenClient = null;
  save(); toast("Settings saved ✓"); render();
}
async function saveThenSign() {
  settings.clientId = document.getElementById("sClientId").value.trim();
  save(); await signIn();
}
function exportJson() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "piano-repertoire.json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importJson(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.pieces)) throw new Error();
      data = j;
      data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
      save(); render(); toast("Imported ✓");
    } catch { toast("Invalid file."); }
  };
  r.readAsText(f);
}

/* ---------- misc ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function escAttr(s) { return esc(s); }

function render() {
  renderHeader(); renderNav();
  if (view === "play") renderPlay();
  else if (view === "list") renderList();
  else renderSettings();
}

load();
render();
if (Object.keys(wipRatings).length || currentPick)
  toast("Recovered your in-progress session ✓");
trySignInSilently();

/* ---------- PWA: manifest + service worker (full offline) ---------- */
(function installPwa() {
  const icon = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='#000'/><text x='256' y='370' font-size='300' text-anchor='middle'>\u{1F3B9}</text></svg>`);
  const manifest = {
    name: "Piano Repertoire Keeper",
    short_name: "PianoKeeper",
    start_url: "./",
    scope: "./",
    display: "standalone",
    background_color: "#000000",
    theme_color: "#000000",
    icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }]
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(link);
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
