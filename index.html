<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Piano Repertoire Keeper</title>
<style>
  :root {
    --bg: #000000; --card: #0a0a0a; --text: #f5f5f5; --muted: #a3a3a3;
    --accent: #f59e0b; --accent-soft: #26200d; --border: #262626;
    --danger: #ef4444; --radius: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
  }
  ::-webkit-scrollbar { background: #000; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding-bottom: 72px; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .3px; }
  header .sub { font-size: .75rem; color: var(--muted); }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  h3 { font-size: .9rem; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: .8rem; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--card); color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  textarea { resize: vertical; min-height: 56px; }
  label { font-size: .78rem; color: var(--muted); display: block; margin: 10px 0 4px; }
  button { font: inherit; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    background: var(--accent); color: #000; font-weight: 600; }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.danger-text { background: none; color: var(--danger); padding: 4px 8px; font-weight: 400; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .piece { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--border); }
  .piece:last-child { border-bottom: none; }
  .piece .title { font-weight: 600; }
  .piece .meta { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .stars { color: var(--accent); letter-spacing: 2px; font-size: .85rem; }
  .suggest-box { text-align: center; padding: 28px 16px; }
  .suggest-box .big { font-size: 1.5rem; font-weight: 700; margin: 6px 0 2px; }
  .rating-row { display: flex; justify-content: center; gap: 10px; margin: 18px 0; }
  .rating-row button { font-size: 1.3rem; background: none; border: 1px solid var(--border);
    border-radius: 10px; width: 48px; height: 48px; color: var(--text); }
  .rating-row button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: #262626; color: #ffffff; padding: 10px 18px; border-radius: 999px;
    border: 1px solid #404040; font-size: .82rem; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 50; max-width: 90vw; }
  .toast.show { opacity: 1; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--border); display: flex; z-index: 20; }
  nav button { flex: 1; background: none; color: var(--muted); padding: 12px 4px;
    font-size: .68rem; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button .ico { font-size: 1.25rem; }
  nav button.active { color: var(--accent); }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: .9rem; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: .68rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  .settings-block { margin-bottom: 20px; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .8em; }
  .sync-state { font-size: .8rem; color: var(--muted); margin-top: 6px; }

  /* WIP section */
  .wip-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .wip-item:last-child { border-bottom: none; }
  .wip-stars { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .wip-stars button.star-btn { font-size: 1.35rem; background: none; color: var(--muted);
    padding: 0 2px; border: none; line-height: 1; }
  .wip-stars button.star-btn.on { color: var(--accent); }
  .wip-stars .mini-btn { padding: 5px 12px; font-size: .75rem; border-radius: 999px; }
  .session-banner { display: flex; justify-content: space-between; align-items: center;
    background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; font-size: .8rem; color: var(--accent); }
  .session-banner button { padding: 7px 14px; font-size: .8rem; }
  .wip-controls { display: flex; gap: 6px; }
  .wip-controls button { padding: 4px 8px; font-size: .75rem; font-weight: 500;
    background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Piano Repertoire Keeper</h1>
    <div class="sub" id="hdrSub"></div>
  </div>
  <div id="hdrSync"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>

<script>
"use strict";
/* ============================================================
   Piano Repertoire Keeper
   - Local-first; optional Google Drive sync (hidden appDataFolder)
   - Perfected list: weighted randomizer (last rating × recency)
   - WIP list: decay-mass priority (practice mass M, decay-weighted
     rating basis, damped tenure), batch session logging
   ============================================================ */

const STORE_KEY = "prk-data-v1";
const SETTINGS_KEY = "prk-settings-v1";
const DRIVE_FILE = "piano-repertoire.json";
const GIS_SRC = "https://accounts.google.com/gsi/client";
const DRIVE_SCOPES = "https://www.googleapis.com/auth/drive.appdata";

/* ---------- state ---------- */
let data = { pieces: [] };   // piece: {id,title,composer,notes,status,wipSince,perfectedSince,
                             //        history:[{ts,rating} | {date,rating} (legacy)]}
let settings = {
  clientId: "",
  halfLifeDays: 21,  // perfected randomizer: recency half-life
  scorePower: 1.6,   // perfected randomizer: rating sensitivity
  tauDays: 14,       // WIP: decay constant for practice mass & rating basis
  autoPush: true
};
let view = "play";
let currentPick = null;
let currentRating = 0;
let editingId = null;
let wipRatings = {};        // pending batch ratings: pieceId -> 1..5
let wipOrderFrozen = null;   // frozen ordering during a session

/* ---------- persistence ---------- */
let storageWarned = false;
function save() {
  data.updatedAt = Date.now();
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {
    if (!storageWarned) {
      storageWarned = true;
      toast("⚠ Browser storage unavailable — data won't persist here. Use the hosted/downloaded version.");
    }
  }
  if (settings.autoPush && signedIn()) schedulePush();
}
function load() {
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || { pieces: [] }; } catch { data = { pieces: [] }; }
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch {}
  data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- helpers ---------- */
function sessionTs(s) { return s.ts ? +new Date(s.ts) : +new Date((s.date || "1970-01-01") + "T00:00:00"); }
function lastSession(p) {
  if (!p.history || !p.history.length) return null;
  return p.history.reduce((a, b) => sessionTs(a) >= sessionTs(b) ? a : b);
}
function hasSessions(p) { return p.history && p.history.length > 0; }
function wipPieces() { return data.pieces.filter(p => p.status === "wip"); }
function perfectedPieces() { return data.pieces.filter(p => p.status !== "wip"); }
function daysSince(isoTs) {
  if (!isoTs) return null;
  return Math.max(0, Math.floor((Date.now() - +new Date(isoTs)) / 86400000));
}
function daysSinceMs(ms) { return Math.max(0, Math.floor((Date.now() - ms) / 86400000)); }
function fmtDays(d) {
  if (d === null) return "never played";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  return d + " days ago";
}
function fmtSessionDays(s) { return s?.ts ? fmtDays(daysSinceMs(sessionTs(s))) : fmtDays(daysSince(s?.date)); }
function fmtDateTime(s) {
  const d = new Date(sessionTs(s));
  const sameDay = new Date().toDateString() === d.toDateString();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return sameDay ? "today " + time : d.toLocaleDateString() + " " + time;
}
function stars(n) { return n ? "★".repeat(n) + "☆".repeat(5 - n) : "—"; }

/* ---------- perfected randomizer ---------- */
function weightOf(p) {
  const last = lastSession(p);
  const scoreW = last ? Math.pow(6 - last.rating, settings.scorePower) : 6;
  const d = last ? daysSinceMs(sessionTs(last)) : null;
  const timeW = d === null ? 2.5 : 1 + d / settings.halfLifeDays;
  return scoreW * timeW;
}
function pickPiece() {
  const pool = perfectedPieces();
  if (!pool.length) return null;
  const ws = pool.map(p => ({ p, w: weightOf(p) }));
  const total = ws.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const x of ws) { r -= x.w; if (r <= 0) return x.p; }
  return ws[ws.length - 1].p;
}

/* ---------- WIP urgency ----------
   M     = Σ e^(−age/τ)                       practice mass
   basis = Σ r·e^(−age/τ) / M                  decay-weighted rating (★1 if never played)
   urgency = (1 + 3/(M+1)) × (6−basis)^1.6 × (1 + daysWIP/28)
---------------------------------- */
function wipStats(p) {
  const tau = settings.tauDays * 86400000;
  const hist = p.history || [];
  let M = 0, wsum = 0;
  for (const s of hist) {
    const age = Math.max(0, Date.now() - sessionTs(s));
    const w = Math.exp(-age / tau);
    M += w; wsum += w * s.rating;
  }
  const basis = M > 0 ? wsum / M : 1;
  const neglect = 1 + 3 / (M + 1);
  return { M, basis, neglect };
}
function wipUrgency(p) {
  const { neglect, basis } = wipStats(p);
  const tenureDays = p.wipSince ? daysSinceMs(+new Date(p.wipSince)) : 0;
  return neglect * Math.pow(6 - basis, 1.6) * (1 + tenureDays / 28);
}
function sortedWip() {
  if (wipOrderFrozen && wipRatings && Object.keys(wipRatings).length) return wipOrderFrozen;
  const s = [...wipPieces()].sort((a, b) => wipUrgency(b) - wipUrgency(a));
  if (Object.keys(wipRatings).length) wipOrderFrozen = s; else wipOrderFrozen = null;
  return s;
}
function endSessionMode() { wipRatings = {}; wipOrderFrozen = null; }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============================================================
   Google Drive sync
   ============================================================ */
let tokenClient = null;
let accessToken = null;
let pushTimer = null;

function signedIn() { return !!accessToken; }

function loadGis() {
  return new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const s = document.createElement("script");
    s.src = GIS_SRC; s.async = true; s.onload = res;
    s.onerror = () => rej(new Error("Could not load Google Identity Services (needs internet)."));
    document.head.appendChild(s);
  });
}

async function ensureTokenClient() {
  await loadGis();
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: settings.clientId,
      scope: DRIVE_SCOPES,
      callback: (resp) => {
        if (resp.access_token) { accessToken = resp.access_token; render(); pushToDrive(); }
      }
    });
  }
}

async function signIn() {
  if (!settings.clientId) { toast("Add your OAuth Client ID in Settings first."); switchView("settings"); return; }
  try {
    await ensureTokenClient();
    tokenClient.requestAccessToken({ prompt: "" });
  } catch (e) { toast(e.message); }
}

async function trySignInSilently() {
  if (!settings.clientId || accessToken) return;
  try {
    await ensureTokenClient();
    tokenClient.requestAccessToken({ prompt: "" });
  } catch {}
}

function signOut() {
  if (accessToken && window.google?.accounts?.oauth2) {
    try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch {}
  }
  accessToken = null; render();
}

async function driveCall(path, opts = {}) {
  const r = await fetch("https://www.googleapis.com/" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + accessToken, ...(opts.headers || {}) }
  });
  if (r.status === 401) { accessToken = null; throw new Error("Session expired — sign in again."); }
  if (!r.ok) throw new Error("Drive error " + r.status);
  return r;
}

async function findDriveFile() {
  const r = await driveCall("drive/v3/files?q=" + encodeURIComponent("name='" + DRIVE_FILE + "'") + "&spaces=appDataFolder&fields=files(id,name,modifiedTime)");
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0] : null;
}

async function pushToDrive(silent) {
  if (!signedIn()) return;
  try {
    const existing = await findDriveFile();
    const boundary = "prk" + Date.now();
    const body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(existing ? { name: DRIVE_FILE } : { name: DRIVE_FILE, mimeType: "application/json", parents: ["appDataFolder"] }) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify(data) + "\r\n" +
      "--" + boundary + "--";
    const url = existing
      ? "https://www.googleapis.com/upload/drive/v3/files/" + existing.id + "?uploadType=multipart"
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    const r = await fetch(url, {
      method: existing ? "PATCH" : "POST",
      headers: { Authorization: "Bearer " + accessToken, "Content-Type": "multipart/related; boundary=" + boundary },
      body
    });
    if (r.status === 401) { accessToken = null; throw new Error("Session expired — sign in again."); }
    if (!r.ok) {
      let detail = r.status;
      try { const e = await r.json(); detail += " " + (e.error?.message || ""); } catch {}
      throw new Error("Upload failed (" + detail + ")");
    }
    if (!silent) toast("Synced to Google Drive ✓");
  } catch (e) { toast("Sync failed: " + e.message); }
}

async function pullFromDrive() {
  if (!signedIn()) { toast("Sign in first."); return; }
  try {
    const f = await findDriveFile();
    if (!f) { toast("No data in Drive yet — will push this device's data."); await pushToDrive(true); return; }
    const r = await driveCall("drive/v3/files/" + f.id + "?alt=media");
    const remote = await r.json();
    if (!remote.pieces) throw new Error("Unexpected file content");
    const remoteNewer =
      (remote.updatedAt || 0) > (data.updatedAt || 0) ||
      (remote.pieces.length > data.pieces.length && !data.pieces.some(hasSessions)) ||
      (data.pieces.length === 0 && remote.pieces.length > 0);
    if (remoteNewer) {
      data = remote;
      data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
      save(); render(); toast("Loaded data from Drive ✓");
    } else { await pushToDrive(true); toast("Local data was newer — pushed to Drive ✓"); render(); }
  } catch (e) { toast("Sync failed: " + e.message); }
}

function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushToDrive(true), 3000);
}

/* ============================================================
   Rendering
   ============================================================ */
function switchView(v) { view = v; editingId = null; endSessionMode(); render(); }

function renderHeader() {
  const wipN = wipPieces().length, repN = perfectedPieces().length;
  document.getElementById("hdrSub").textContent =
    `${repN} in repertoire · ${wipN} in practice`;
  const hdr = document.getElementById("hdrSync");
  hdr.innerHTML = signedIn() ? '<button class="ghost" onclick="pullFromDrive()">Sync ⟳</button>' : "";
}

function renderNav() {
  const items = [["play", "🎲", "Play"], ["list", "🎵", "Pieces"], ["settings", "⚙️", "Settings"]];
  document.getElementById("nav").innerHTML = items.map(([v, ico, label]) =>
    `<button class="${view === v ? "active" : ""}" onclick="switchView('${v}')">
       <span class="ico">${ico}</span>${label}</button>`).join("");
}

/* ----- Play view ----- */
function renderPlay() {
  const app = document.getElementById("app");
  if (currentPick) return renderRatingScreen();
  const wip = sortedWip();
  const perfs = perfectedPieces();
  const pending = Object.keys(wipRatings).length;

  app.innerHTML = `
    ${wip.length ? renderWipCard(wip, pending) : ""}
    ${perfs.length ? `
    <div class="card suggest-box">
      <div class="muted">Feeling rusty?</div>
      <div class="big">Roll the dice</div>
      <div class="muted" style="margin-bottom:14px">Weighted by your last rating &amp; time since played</div>
      <button onclick="suggest()">Suggest a piece</button>
    </div>
    <div class="card">
      <h3>Highest priority right now</h3>
      <ul class="plain">
        ${perfs.map(p => ({ p, w: weightOf(p) })).sort((a, b) => b.w - a.w).slice(0, 3).map(({ p, w }) => `
          <li class="piece">
            <div>
              <div class="title">${esc(p.title)}</div>
              <div class="meta">${esc(p.composer || "")} · ${fmtSessionDays(lastSession(p))} · ${stars(lastSession(p)?.rating)}</div>
            </div>
            <span class="tag">+${w.toFixed(1)}</span>
          </li>`).join("")}
      </ul>
    </div>` : (!wip.length ? `<div class="card"><div class="empty">
      Your repertoire is empty.<br/>Add pieces under <b>Pieces</b>.</div></div>` : "")}`;
}

function renderWipCard(wip, pending) {
  return `
    <div class="card">
      <h3>🎹 In practice</h3>
      ${pending ? `
      <div class="session-banner">
        <span>Session in progress — order frozen · ${pending} rated</span>
        <div class="row">
          <button class="secondary" onclick="clearSession()">Clear</button>
          <button onclick="logSession()">Log session</button>
        </div>
      </div>` : `<div class="muted" style="margin-bottom:6px">Tap stars to rate, then log — order updates after logging</div>`}
      <ul class="plain">
        ${wip.map((p, idx) => {
          const st = wipStats(p);
          const last = lastSession(p);
          const r = wipRatings[p.id] || 0;
          const tenure = p.wipSince ? daysSinceMs(+new Date(p.wipSince)) : 0;
          return `
          <li class="wip-item">
            <div class="piece" style="padding:0;border:none">
              <div style="flex:1">
                <div class="title">${esc(p.title)} <span class="tag">#${idx + 1}</span></div>
                <div class="meta">${esc(p.composer || "")} · ${tenure}d in practice · ${p.history?.length || 0} sessions
                  · last: ${last ? fmtDateTime(last) + " " + stars(last.rating) : "never"}
                  · basis ${st.basis.toFixed(1)}★</div>
              </div>
              <span class="tag">urg ${wipUrgency(p).toFixed(1)}</span>
            </div>
            <div class="wip-stars">
              ${[1,2,3,4,5].map(n => `<button class="star-btn ${r >= n ? "on" : ""}" onclick="setWipRating('${p.id}',${n})">★</button>`).join("")}
              ${r ? `<button class="mini-btn" onclick="logOne('${p.id}')">Log</button>
                     <button class="mini-btn ghost" onclick="setWipRating('${p.id}',0)">✕</button>` : ""}
            </div>
          </li>`;
        }).join("")}
      </ul>
    </div>`;
}

function setWipRating(id, n) {
  if (n === 0) delete wipRatings[id]; else wipRatings[id] = n;
  if (!wipOrderFrozen) wipOrderFrozen = sortedWip(); // freeze on first rating
  render();
}
function logOne(id) {
  const r = wipRatings[id];
  if (!r) return;
  const p = data.pieces.find(x => x.id === id);
  if (p) { (p.history = p.history || []).push({ ts: new Date().toISOString(), rating: r }); }
  delete wipRatings[id];
  if (!Object.keys(wipRatings).length) endSessionMode();
  save(); render(); toast("Logged ✓");
}
function logSession() {
  const ids = Object.keys(wipRatings);
  if (!ids.length) return;
  const ts = new Date().toISOString();
  for (const id of ids) {
    const p = data.pieces.find(x => x.id === id);
    if (p) (p.history = p.history || []).push({ ts, rating: wipRatings[id] });
  }
  const n = ids.length;
  endSessionMode();
  save(); render(); toast(`Logged ${n} piece${n > 1 ? "s" : ""} — nice session! 🎹`);
}
function clearSession() { endSessionMode(); render(); }

function suggest() {
  currentPick = pickPiece();
  if (!currentPick) return;
  currentRating = 0;
  render();
}

function renderRatingScreen() {
  const p = currentPick;
  const last = lastSession(p);
  document.getElementById("app").innerHTML = `
    <div class="card suggest-box">
      <div class="muted">Time to play</div>
      <div class="big">${esc(p.title)}</div>
      <div class="muted">${esc(p.composer || "")}</div>
      ${p.notes ? `<div class="muted" style="margin-top:8px;font-style:italic">${esc(p.notes)}</div>` : ""}
      ${last ? `<div class="muted" style="margin-top:8px">Last played ${fmtDateTime(last)} · rated ${stars(last.rating)}</div>` : `<div class="muted" style="margin-top:8px">First session back!</div>`}
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0" />
      <h3>How did it go?</h3>
      <div class="rating-row">
        ${[1,2,3,4,5].map(n =>
          `<button class="${currentRating >= n ? "on" : ""}" onclick="setRating(${n})">★</button>`).join("")}
      </div>
      <div class="muted" style="margin-bottom:14px">
        ${currentRating === 0 ? "Tap the stars" : ["","Rough — needs serious work","Shaky, quite rusty","Okay with slips","Solid, minor slips","Near performance level"][currentRating]}
      </div>
      <div class="row" style="justify-content:center">
        <button class="secondary" onclick="skipPick()">Skip</button>
        <button onclick="saveRating()" ${currentRating ? "" : "disabled"}>Save session</button>
      </div>
    </div>`;
}

function setRating(n) { currentRating = n; render(); }
function skipPick() { currentPick = null; render(); }
function saveRating() {
  if (!currentPick || !currentRating) return;
  const p = data.pieces.find(x => x.id === currentPick.id);
  if (p) (p.history = p.history || []).push({ ts: new Date().toISOString(), rating: currentRating });
  currentPick = null; currentRating = 0;
  save(); render(); toast("Session saved 🎹");
}

/* ----- Pieces view: WIP + Repertoire ----- */
function renderList() {
  const app = document.getElementById("app");
  const formPiece = editingId ? data.pieces.find(p => p.id === editingId) : null;
  const wip = [...wipPieces()].sort((a, b) => wipUrgency(b) - wipUrgency(a));
  const reps = [...perfectedPieces()].sort((a, b) =>
    (daysSinceMs(sessionTs(lastSession(b) || {})) || 9999) - (daysSinceMs(sessionTs(lastSession(a) || {})) || 9999));

  app.innerHTML = `
    <div class="card">
      <h3>${editingId ? "Edit piece" : "Add a piece"}</h3>
      <label>Status</label>
      <select id="fStatus">
        <option value="wip" ${formPiece?.status === "wip" ? "selected" : ""}>🎹 In practice (WIP)</option>
        <option value="perfected" ${editingId && formPiece?.status !== "wip" ? "selected" : ""}>🏆 Perfected repertoire</option>
      </select>
      <label>Composer</label>
      <input type="text" id="fComposer" placeholder="Chopin" value="${escAttr(formPiece?.composer || "")}">
      <label>Title *</label>
      <input type="text" id="fTitle" placeholder="Nocturne Op. 9 No. 2" value="${escAttr(formPiece?.title || "")}">
      <label>Notes (optional)</label>
      <textarea id="fNotes" placeholder="e.g. struggled with the coda">${esc(formPiece?.notes || "")}</textarea>
      <div class="row" style="margin-top:12px">
        <button onclick="savePiece()">${editingId ? "Save changes" : "Add piece"}</button>
        ${editingId ? '<button class="ghost" onclick="cancelEdit()">Cancel</button>' : ""}
      </div>
    </div>

    <div class="card">
      <h3>🎹 In practice (${wip.length})</h3>
      ${wip.length ? `<ul class="plain">${wip.map(p => pieceRow(p, true)).join("")}</ul>`
      : `<div class="empty">No pieces in practice. Add one above or send a repertoire piece back for rework.</div>`}
    </div>

    <div class="card">
      <h3>🏆 Perfected repertoire (${reps.length})</h3>
      ${reps.length ? `<ul class="plain">${reps.map(p => pieceRow(p, false)).join("")}</ul>`
      : `<div class="empty">Nothing here yet — mark a WIP piece as perfected or add directly.</div>`}
    </div>`;
}

function pieceRow(p, isWip) {
  const last = lastSession(p);
  const tenure = isWip && p.wipSince ? ` · ${daysSinceMs(+new Date(p.wipSince))}d in practice` : "";
  return `<li class="piece">
    <div style="flex:1">
      <div class="title">${esc(p.title)}</div>
      <div class="meta">${esc(p.composer || "—")} · ${fmtSessionDays(last)} · <span class="stars">${stars(last?.rating)}</span>
        ${p.history?.length > 1 ? ` · ${p.history.length} sessions` : ""}${tenure}</div>
    </div>
    <div class="wip-controls">
      ${isWip
        ? `<button onclick="markPerfected('${p.id}')">🎓 Done</button>`
        : `<button onclick="markWip('${p.id}')">↩ Rework</button>`}
      <button class="danger-text" onclick="editPiece('${p.id}')">✏️</button>
      <button class="danger-text" onclick="removePiece('${p.id}')">🗑</button>
    </div>
  </li>`;
}

function savePiece() {
  const title = document.getElementById("fTitle").value.trim();
  const composer = document.getElementById("fComposer").value.trim();
  const notes = document.getElementById("fNotes").value.trim();
  const status = document.getElementById("fStatus").value;
  if (!title) { toast("A title is required."); return; }
  if (editingId) {
    const p = data.pieces.find(x => x.id === editingId);
    const changed = p.status !== status;
    Object.assign(p, { title, composer, notes, status });
    if (status === "wip" && changed) p.wipSince = new Date().toISOString();
    if (status === "perfected" && changed) p.perfectedSince = new Date().toISOString();
  } else {
    const nowIso = new Date().toISOString();
    data.pieces.push({
      id: uid(), title, composer, notes, status, history: [],
      wipSince: status === "wip" ? nowIso : null,
      perfectedSince: status === "perfected" ? nowIso : null
    });
  }
  editingId = null;
  save(); render(); toast("Saved ✓");
}
function editPiece(id) { editingId = id; render(); }
function cancelEdit() { editingId = null; render(); }
function removePiece(id) {
  const p = data.pieces.find(x => x.id === id);
  if (p && confirm(`Remove "${p.title}" and its play history?`)) {
    data.pieces = data.pieces.filter(x => x.id !== id);
    save(); render(); toast("Removed.");
  }
}
function markPerfected(id) {
  const p = data.pieces.find(x => x.id === id);
  if (!p) return;
  const last = lastSession(p);
  p.status = "perfected";
  p.perfectedSince = new Date().toISOString();
  delete wipRatings[id];
  save(); render();
  toast(`🎓 "${p.title}" perfected! ${last ? "Final rating: " + stars(last.rating) : ""}`);
}
function markWip(id) {
  const p = data.pieces.find(x => x.id === id);
  if (!p) return;
  p.status = "wip";
  p.wipSince = new Date().toISOString(); // tenure restarts
  save(); render(); toast(`"${p.title}" sent back to practice — clock restarted.`);
}

/* ----- Settings ----- */
function renderSettings() {
  document.getElementById("app").innerHTML = `
    <div class="card settings-block">
      <h3>Google Drive sync</h3>
      <p class="muted">Your repertoire is stored as a hidden JSON file in your own Drive (appDataFolder).</p>
      <label>OAuth Client ID</label>
      <input type="text" id="sClientId" placeholder="xxxxxxxx.apps.googleusercontent.com" value="${escAttr(settings.clientId)}">
      <div class="sync-state">${signedIn()
        ? "🟢 Signed in — data syncs automatically a few seconds after each change."
        : "⚪ Not signed in."}</div>
      <div class="row wrap" style="margin-top:12px">
        <button onclick="saveSettings()">${signedIn() ? "Saved" : "Save"}</button>
        ${signedIn()
          ? '<button class="secondary" onclick="pullFromDrive()">Pull from Drive</button>'
          : '<button class="secondary" onclick="saveThenSign()">Save &amp; sign in</button>'}
        ${signedIn() ? '<button class="ghost" onclick="signOut()">Sign out</button>' : ""}
      </div>
      <details style="margin-top:14px">
        <summary class="muted" style="cursor:pointer">How to get a Client ID (one-time, ~15 min)</summary>
        <ol class="muted" style="padding-left:18px;line-height:1.7">
          <li>Go to <a href="https://console.cloud.google.com" target="_blank" rel="noreferrer">console.cloud.google.com</a> → create a project.</li>
          <li>APIs &amp; Services → Library → enable <b>Google Drive API</b>.</li>
          <li>OAuth consent screen → External → add yourself as a test user.</li>
          <li>Credentials → Create credentials → <b>OAuth Client ID</b> → Web application.</li>
          <li>Add this page's origin under <b>Authorized JavaScript origins</b>.</li>
          <li>Copy the Client ID here, and sign in.</li>
        </ol>
      </details>
    </div>

    <div class="card settings-block">
      <h3>🎲 Repertoire randomizer</h3>
      <label>Recency half-life: <b id="hlOut">${settings.halfLifeDays}</b> days unplayed adds one unit of urgency</label>
      <input type="range" id="sHalfLife" min="3" max="60" value="${settings.halfLifeDays}" oninput="document.getElementById('hlOut').textContent=this.value">
      <label>Rating sensitivity: <b id="spOut">${settings.scorePower}</b></label>
      <input type="range" id="sScorePower" min="1" max="3" step="0.1" value="${settings.scorePower}" oninput="document.getElementById('spOut').textContent=this.value">
    </div>

    <div class="card settings-block">
      <h3>🎹 In-practice priority</h3>
      <p class="muted">How fast practice credit fades: a session's weight is e^(−age/τ). Higher τ = more forgiving of gaps.</p>
      <label>Decay constant τ: <b id="tauOut">${settings.tauDays}</b> days</label>
      <input type="range" id="sTau" min="7" max="30" value="${settings.tauDays}" oninput="document.getElementById('tauOut').textContent=this.value">
      <div style="margin-top:12px"><button class="secondary" onclick="saveSettings()">Save tuning</button></div>
    </div>

    <div class="card settings-block">
      <h3>Backup (manual)</h3>
      <div class="row wrap">
        <button class="ghost" onclick="exportJson()">Export JSON</button>
        <button class="ghost" onclick="document.getElementById('importFile').click()">Import JSON</button>
        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJson(event)">
      </div>
      <p class="muted" style="margin-top:8px">Useful as a backup even with Drive sync enabled.</p>
    </div>`;
}

function saveSettings() {
  const cid = document.getElementById("sClientId");
  if (cid) settings.clientId = cid.value.trim();
  const hl = document.getElementById("sHalfLife");
  if (hl) settings.halfLifeDays = +hl.value;
  const sp = document.getElementById("sScorePower");
  if (sp) settings.scorePower = +sp.value;
  const tau = document.getElementById("sTau");
  if (tau) settings.tauDays = +tau.value;
  tokenClient = null;
  save(); toast("Settings saved ✓"); render();
}
async function saveThenSign() {
  settings.clientId = document.getElementById("sClientId").value.trim();
  save(); await signIn();
}
function exportJson() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "piano-repertoire.json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importJson(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.pieces)) throw new Error();
      data = j;
      data.pieces.forEach(p => { if (!p.status) p.status = "perfected"; });
      save(); render(); toast("Imported ✓");
    } catch { toast("Invalid file."); }
  };
  r.readAsText(f);
}

/* ---------- misc ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function escAttr(s) { return esc(s); }

function render() {
  renderHeader(); renderNav();
  if (view === "play") renderPlay();
  else if (view === "list") renderList();
  else renderSettings();
}

load();
render();
trySignInSilently();
</script>
</body>
</html>
